name: OpenWrt 25.12.5 UFI001C v3.1.2 Setup

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the checked USB ZIP to GitHub Releases
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  firmware:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CCACHE_MAXSIZE: 1500M
    steps:
      - name: Download this port
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl cpio perl pkgconf \
            mtools android-sdk-libsparse-utils zstd qemu-user jq nodejs
      - name: Check installer and network regressions
        run: python3 -m unittest discover -s ufi001c-port/tests -v
      - name: Prepare locked source and feeds
        run: |
          set -o pipefail
          python3 ufi001c-port/prepare.py "$RUNNER_TEMP/openwrt"
          cd "$RUNNER_TEMP/openwrt"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          python3 "$GITHUB_WORKSPACE/ufi001c-port/finalize_feeds.py" "$RUNNER_TEMP/openwrt"
          cp ufi001c.config .config
          make defconfig 2>&1 | tee config-check.log
          if grep -q 'recursive dependency detected' config-check.log; then exit 1; fi
          python3 "$GITHUB_WORKSPACE/ufi001c-port/check_config.py" .config
      - name: Restore downloads and compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ runner.temp }}/openwrt/dl
            ${{ runner.temp }}/openwrt/.ccache
          key: ufi-v3-${{ runner.os }}-${{ hashFiles('ufi001c-port/sources.lock.json', 'ufi001c-port/addons.lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ufi-v3-${{ runner.os }}-${{ hashFiles('ufi001c-port/sources.lock.json', 'ufi001c-port/addons.lock.json') }}-
      - name: Download sources
        working-directory: ${{ runner.temp }}/openwrt
        run: |
          set -o pipefail
          make -j8 download 2>&1 | tee download.log
          # The aggregate download target can ignore individual failures.
          # Check the four corrected OpenStick recipes explicitly.
          for package in gc libusbgx qrtr rmtfs; do
            make "package/openstick/$package/download" V=s 2>&1 | tee -a download.log
          done
      - name: Compile firmware
        working-directory: ${{ runner.temp }}/openwrt
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee build.log
      - name: Verify built kernel policy routing
        run: |
          set -o pipefail
          python3 ufi001c-port/check_kernel.py "$RUNNER_TEMP/openwrt" | tee "$RUNNER_TEMP/kernel-routing-check.txt"
          python3 ufi001c-port/check_rootfs.py "$RUNNER_TEMP/openwrt" | tee "$RUNNER_TEMP/routing-rootfs-check.json"
      - name: Collect and inspect images
        run: |
          python3 ufi001c-port/collect.py "$RUNNER_TEMP/openwrt" "$RUNNER_TEMP/UFI001C-OpenWrt-25.12.5"
          python3 ufi001c-port/check_xhttp.py "$RUNNER_TEMP/openwrt" --report "$RUNNER_TEMP/UFI001C-OpenWrt-25.12.5/xhttp-validation.json"
          cp ufi001c-port/addons.lock.json "$RUNNER_TEMP/UFI001C-OpenWrt-25.12.5/"
          cp ufi001c-port/migration/ufi-install.py ufi001c-port/migration/radio_backup.py "$RUNNER_TEMP/UFI001C-OpenWrt-25.12.5/"
          cp ufi001c-port/INSTALL-RU.md "$RUNNER_TEMP/UFI001C-OpenWrt-25.12.5/"
          cp ufi001c-port/VALIDATION-v3.1.2.md "$RUNNER_TEMP/UFI001C-OpenWrt-25.12.5/"
          cp "$RUNNER_TEMP/kernel-routing-check.txt" "$RUNNER_TEMP/UFI001C-OpenWrt-25.12.5/"
          cp "$RUNNER_TEMP/routing-rootfs-check.json" "$RUNNER_TEMP/UFI001C-OpenWrt-25.12.5/"
          python3 ufi001c-port/migration/package_stock.py "$RUNNER_TEMP/UFI001C-OpenWrt-25.12.5"
      - name: Package the single USB installation ZIP
        run: |
          mkdir -p "$RUNNER_TEMP/ufi-release"
          python3 ufi001c-port/package_release.py \
            "$RUNNER_TEMP/UFI001C-OpenWrt-25.12.5" \
            "$RUNNER_TEMP/ufi-release/UFI001C-OpenWrt-25.12.5-v3.1.2-USB.zip" \
            --commit "$GITHUB_SHA"
      - name: Save firmware and access details
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UFI001C-OpenWrt-25.12.5-v3.1.2-Setup
          path: ${{ runner.temp }}/UFI001C-OpenWrt-25.12.5/
          if-no-files-found: error
          retention-days: 14
      - name: Save single download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UFI001C-v3.1.2-USB-Download
          path: ${{ runner.temp }}/ufi-release/
          if-no-files-found: error
          retention-days: 14
      - name: Publish checked USB archive
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "ufi001c-v3.1.2-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" \
            "$RUNNER_TEMP/ufi-release/UFI001C-OpenWrt-25.12.5-v3.1.2-USB.zip" \
            "$RUNNER_TEMP/ufi-release/UFI001C-OpenWrt-25.12.5-v3.1.2-USB.zip.sha256" \
            --target "$GITHUB_SHA" --title "UFI001C OpenWrt 25.12.5 — v3.1.2 Setup" \
            --notes-file ufi001c-port/RELEASE-NOTES-v3.1.2.md --prerelease
      - name: Save build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-log
          path: |
            ${{ runner.temp }}/openwrt/build.log
            ${{ runner.temp }}/openwrt/config-check.log
            ${{ runner.temp }}/openwrt/download.log
            ${{ runner.temp }}/kernel-routing-check.txt
            ${{ runner.temp }}/routing-rootfs-check.json
          if-no-files-found: ignore
