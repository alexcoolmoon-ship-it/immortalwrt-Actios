name: OpenWrt 25.12.5 UFI001C v3.2.2 Clean / Portable USB

on:
  push:
    branches: [codex/ufi001c-clean-v3.2.2]
    paths: ["ufi001c-port/**", ".github/workflows/openwrt25-ufi001c.yml"]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the checked USB ZIP to GitHub Releases
        type: boolean
        default: true

permissions:
  contents: read

# A corrected source supersedes its unfinished image; compile only the latest.
concurrency:
  group: ufi001c-firmware
  cancel-in-progress: true

jobs:
  dns-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download this port
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install ARM64 emulator and image reader
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user e2fsprogs jq openssl bsdextrautils nodejs
      - name: Retrieve previously verified r12 reference images
        id: reference
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: UFI001C-OpenWrt-25.12.5-v3.2.1-Clean
          run-id: 39166769599
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ufi-reference-images
      - name: Verify and extract the actual reference ARM64 engine
        if: ${{ steps.reference.outcome == 'success' }}
        run: python3 ufi001c-port/ci/reference_engine.py "$RUNNER_TEMP/ufi-reference-images" "$RUNNER_TEMP/ufi-reference"
      - name: Check live DNS, FakeIP, restart and upstream failure
        if: ${{ steps.reference.outcome == 'success' }}
        run: |
          export UFI_TEST_ENGINE="qemu-aarch64 -L $RUNNER_TEMP/ufi-reference/root $RUNNER_TEMP/ufi-reference/root/usr/bin/sing-box"
          sudo --preserve-env=UFI_TEST_ENGINE python3 -m unittest discover -s ufi001c-port/tests -p 'test_clean*.py' -v
          sudo --preserve-env=UFI_TEST_ENGINE python3 -m unittest discover -s ufi001c-port/tests -p 'test_cloudflare_patch.py' -v
      - name: Require final live checks when the optional reference has expired
        if: ${{ steps.reference.outcome != 'success' }}
        run: echo 'Reference artifact is unavailable; live checks with the newly built engine remain mandatory.'
  windows-tools:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Download this port
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select Python for the portable Windows tools
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Check resumable reads and native Windows file locking
        run: python -m unittest discover -s ufi001c-port/tests -p test_chunk_backup.py -v
      - name: Check portable runtime guards
        run: python -m unittest discover -s ufi001c-port/tests -p test_portable_runtime.py -v
      - name: Check pinned loader download guards
        run: python -m unittest discover -s ufi001c-port/tests -p test_windows_sources.py -v
      - name: Check native CMD report exit codes
        run: python -m unittest discover -s ufi001c-port/tests -p test_cmd_reporting.py -v
      - name: Install locked build tools
        run: python -m pip install --require-hashes -r ufi001c-port/ci/windows-build-requirements.txt
      - name: Build and smoke-test offline Windows executables
        run: >-
          python ufi001c-port/ci/build_windows.py
          --work "$env:RUNNER_TEMP/ufi-windows-build"
          --output "$env:RUNNER_TEMP/USB тест/runtime"
          --commit "$env:GITHUB_SHA"
      - name: Save verified Windows runtime
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ufi001c-windows-runtime-v3.2.2
          path: ${{ runner.temp }}/USB тест/runtime/
          if-no-files-found: error
          retention-days: 14
  firmware:
    needs: [windows-tools, dns-preflight]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CCACHE_MAXSIZE: 1500M
    steps:
      - name: Download this port
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select compiler cache directory
        run: echo "CCACHE_DIR=$RUNNER_TEMP/openwrt/.ccache" >> "$GITHUB_ENV"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl cpio perl pkgconf \
            mtools android-sdk-libsparse-utils zstd qemu-user jq nodejs openssl bsdextrautils
      - name: Check installer and network regressions
        run: python3 -m unittest discover -s ufi001c-port/tests -v
      - name: Prepare locked source and feeds
        run: |
          set -o pipefail
          python3 ufi001c-port/prepare.py "$RUNNER_TEMP/openwrt"
          cd "$RUNNER_TEMP/openwrt"
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          python3 "$GITHUB_WORKSPACE/ufi001c-port/finalize_feeds.py" "$RUNNER_TEMP/openwrt"
          cp ufi001c.config .config
          make defconfig 2>&1 | tee config-check.log
          if grep -q 'recursive dependency detected' config-check.log; then exit 1; fi
          python3 "$GITHUB_WORKSPACE/ufi001c-port/check_config.py" .config
      - name: Restore source downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/openwrt/dl
          key: ufi-dl-v4-ubuntu24-${{ runner.arch }}-${{ hashFiles('ufi001c-port/sources.lock.json', 'ufi001c-port/addons.lock.json', 'ufi001c-port/feeds.conf', 'ufi001c-port/overlay/**/Makefile', 'ufi001c-port/overlay/ufi001c.config', 'ufi001c-port/feed-overrides/**', 'ufi001c-port/clean/**') }}
          restore-keys: |
            ufi-dl-v4-ubuntu24-${{ runner.arch }}-
      - name: Restore compiler cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/openwrt/.ccache
          # Cache entries are immutable. Change the key with build inputs, not
          # run_id, so repeated builds reuse one entry while source edits can
          # save updated results. The fallback stays on the locked toolchain.
          key: ufi-ccache-v4-ubuntu24-${{ runner.arch }}-${{ hashFiles('ufi001c-port/sources.lock.json', 'ufi001c-port/feeds.conf') }}-${{ hashFiles('ufi001c-port/addons.lock.json', 'ufi001c-port/overlay/**', 'ufi001c-port/feed-overrides/**', 'ufi001c-port/board-drivers.patch', 'ufi001c-port/clean/**') }}
          restore-keys: |
            ufi-ccache-v4-ubuntu24-${{ runner.arch }}-${{ hashFiles('ufi001c-port/sources.lock.json', 'ufi001c-port/feeds.conf') }}-
      - name: Download sources
        run: |
          python3 ufi001c-port/ci/download_sources.py "$RUNNER_TEMP/openwrt" --jobs 8
      - name: Compile firmware
        working-directory: ${{ runner.temp }}/openwrt
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee build.log
      - name: Report compiler cache statistics
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if test -x "$RUNNER_TEMP/openwrt/staging_dir/host/bin/ccache"; then
            "$RUNNER_TEMP/openwrt/staging_dir/host/bin/ccache" --show-stats | tee "$RUNNER_TEMP/ccache-stats.txt"
            if test -d "$CCACHE_DIR"; then
              du -sh "$CCACHE_DIR" | tee -a "$RUNNER_TEMP/ccache-stats.txt"
            fi
          else
            echo 'ccache has not been built; see the earlier failed step.' | tee "$RUNNER_TEMP/ccache-stats.txt"
          fi
      - name: Verify built kernel policy routing
        run: |
          set -o pipefail
          python3 ufi001c-port/check_kernel.py "$RUNNER_TEMP/openwrt" | tee "$RUNNER_TEMP/kernel-routing-check.txt"
          python3 ufi001c-port/check_rootfs.py "$RUNNER_TEMP/openwrt" | tee "$RUNNER_TEMP/routing-rootfs-check.json"
      - name: Check clean DNS and FakeIP with the built ARM64 engine
        run: |
          set -eu
          UFI_ROOT=$(find "$RUNNER_TEMP/openwrt/build_dir" -type d -name root-msm89xx | head -n1)
          test -x "$UFI_ROOT/usr/bin/sing-box"
          export UFI_TEST_ENGINE="qemu-aarch64 -L $UFI_ROOT $UFI_ROOT/usr/bin/sing-box"
          sudo --preserve-env=UFI_TEST_ENGINE python3 -m unittest discover -s ufi001c-port/tests -p 'test_clean*.py' -v
          sudo --preserve-env=UFI_TEST_ENGINE python3 -m unittest discover -s ufi001c-port/tests -p 'test_cloudflare_patch.py' -v
      - name: Collect and inspect images
        id: images
        run: |
          python3 ufi001c-port/collect.py "$RUNNER_TEMP/openwrt" "$RUNNER_TEMP/UFI001C-OpenWrt-25.12.5"
          python3 ufi001c-port/check_xhttp.py "$RUNNER_TEMP/openwrt" --report "$RUNNER_TEMP/UFI001C-OpenWrt-25.12.5/xhttp-validation.json"
          cp ufi001c-port/addons.lock.json "$RUNNER_TEMP/UFI001C-OpenWrt-25.12.5/"
          cp ufi001c-port/migration/ufi-install.py ufi001c-port/migration/radio_backup.py "$RUNNER_TEMP/UFI001C-OpenWrt-25.12.5/"
          cp ufi001c-port/INSTALL-RU.md "$RUNNER_TEMP/UFI001C-OpenWrt-25.12.5/"
          cp ufi001c-port/VALIDATION-v3.2.2.md "$RUNNER_TEMP/UFI001C-OpenWrt-25.12.5/"
          cp "$RUNNER_TEMP/kernel-routing-check.txt" "$RUNNER_TEMP/UFI001C-OpenWrt-25.12.5/"
          cp "$RUNNER_TEMP/routing-rootfs-check.json" "$RUNNER_TEMP/UFI001C-OpenWrt-25.12.5/"
          python3 ufi001c-port/migration/package_stock.py "$RUNNER_TEMP/UFI001C-OpenWrt-25.12.5"
      - name: Retrieve the Windows runtime from this exact run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ufi001c-windows-runtime-v3.2.2
          path: ${{ runner.temp }}/ufi-windows-runtime
      - name: Package the single USB installation ZIP
        run: |
          mkdir -p "$RUNNER_TEMP/ufi-release"
          python3 ufi001c-port/package_release.py \
            "$RUNNER_TEMP/UFI001C-OpenWrt-25.12.5" \
            "$RUNNER_TEMP/ufi-release/UFI001C-OpenWrt-25.12.5-v3.2.2-USB.zip" \
            --commit "$GITHUB_SHA" \
            --windows-runtime "$RUNNER_TEMP/ufi-windows-runtime"
      - name: Save firmware and access details
        if: ${{ !cancelled() && steps.images.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UFI001C-OpenWrt-25.12.5-v3.2.2-Clean
          path: ${{ runner.temp }}/UFI001C-OpenWrt-25.12.5/
          if-no-files-found: error
          retention-days: 14
      - name: Save single download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UFI001C-v3.2.2-USB-Download
          path: ${{ runner.temp }}/ufi-release/
          if-no-files-found: error
          retention-days: 14
      - name: Publish checked USB archive
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "ufi001c-v3.2.2-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" \
            "$RUNNER_TEMP/ufi-release/UFI001C-OpenWrt-25.12.5-v3.2.2-USB.zip" \
            "$RUNNER_TEMP/ufi-release/UFI001C-OpenWrt-25.12.5-v3.2.2-USB.zip.sha256" \
            --target "$GITHUB_SHA" --title "UFI001C OpenWrt 25.12.5 — v3.2.2 Clean / Portable USB" \
            --notes-file ufi001c-port/RELEASE-NOTES-v3.2.2.md --prerelease
      - name: Save build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-log
          path: |
            ${{ runner.temp }}/openwrt/build.log
            ${{ runner.temp }}/openwrt/config-check.log
            ${{ runner.temp }}/openwrt/download.log
            ${{ runner.temp }}/openwrt/download-check.json
            ${{ runner.temp }}/ccache-stats.txt
            ${{ runner.temp }}/kernel-routing-check.txt
            ${{ runner.temp }}/routing-rootfs-check.json
          if-no-files-found: ignore
